<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>A股人设鉴定器</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#f5f0eb;--card:#fff;--text:#1d1d1f;--text2:#86868b;--text3:#aeaeb2;--accent:#1d1d1f;--radius:0px;--shadow:none}
    html,body{height:100%;font-family:"Courier New","PingFang SC","Microsoft YaHei",monospace;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
    body{overflow:hidden}
    .app{height:100vh;height:100dvh;max-width:500px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}
    .page{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 20px;transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .35s ease;overflow-y:auto;-webkit-overflow-scrolling:touch}
    .page.hidden{transform:translateX(36px);opacity:0;pointer-events:none}
    .page::-webkit-scrollbar{display:none}
    .page{-ms-overflow-style:none;scrollbar-width:none}

    #cover{justify-content:center;align-items:center;text-align:center;padding:36px 20px 28px;background:#f5f0eb;position:relative;overflow:hidden}
    #cover .kline-bg{position:absolute;inset:0;opacity:.12;pointer-events:none}
    #cover .kline-bg svg{width:100%;height:100%}
    .cb{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.06);padding:4px 11px;font-size:10px;color:rgba(0,0,0,.4);margin-bottom:22px;font-weight:600;letter-spacing:1.5px}
    .ci{font-size:54px;margin-bottom:10px;position:relative;z-index:1}
    #cover h1{font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.15;margin-bottom:6px;color:#1a1a1a;position:relative;z-index:1}
    #cover .sub{font-size:13px;color:rgba(0,0,0,.45);line-height:1.6;position:relative;z-index:1;letter-spacing:.3px}
    .ct{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin:14px 0 26px;max-width:340px;position:relative;z-index:1}
    .ct span{background:rgba(0,0,0,.03);border:1px solid rgba(0,0,0,.05);padding:3px 7px;font-size:10px;color:rgba(0,0,0,.4)}

    .qh{display:flex;align-items:center;gap:12px;padding:16px 0 4px;flex-shrink:0}
    .qp{flex:1;height:4px;background:rgba(0,0,0,.06);overflow:hidden}
    .qf{height:100%;background:#1a1a1a;transition:width .35s ease}
    .qc{font-size:13px;color:var(--text2);font-weight:500;white-space:nowrap}

    .qb{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 0 16px}
    .qt{font-size:18px;font-weight:600;line-height:1.55;margin-bottom:24px;letter-spacing:-.2px}
    .qo{display:flex;flex-direction:column;gap:9px}
    .qopt{background:var(--card);border:1px solid rgba(0,0,0,.06);padding:13px 15px;font-size:14px;line-height:1.5;cursor:pointer;transition:all .1s ease;text-align:left;color:var(--text);-webkit-tap-highlight-color:transparent}
    .qopt:active{transform:scale(.985)}
    .qopt.selected{border-color:#1a1a1a;background:rgba(0,0,0,.02)}
    .qopt-inner{display:flex;align-items:flex-start;gap:10px}
    .ql{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:1px solid rgba(0,0,0,.12);font-size:10px;font-weight:700;flex-shrink:0;margin-top:2px;color:var(--text3)}
    .qopt.selected .ql{border-color:#1a1a1a;color:#1a1a1a;background:#1a1a1a;color:#fff}

    .qf2{padding:8px 0 20px;flex-shrink:0}
    .btn{display:flex;align-items:center;justify-content:center;width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:all .12s ease;-webkit-tap-highlight-color:transparent}
    .btn:active{transform:scale(.97)}
    .btn-jelly{font-size:17px;padding:16px 0;background:#1a1a1a;color:#fff;border-radius:999px;font-weight:700;letter-spacing:1px;position:relative;z-index:1;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease;box-shadow:0 4px 14px rgba(0,0,0,.08);-webkit-tap-highlight-color:transparent;cursor:pointer;border:none;width:100%;display:flex;align-items:center;justify-content:center;font-family:inherit}
    .btn-jelly:hover{transform:scale(1.02);box-shadow:0 6px 20px rgba(0,0,0,.1)}
    .btn-jelly:active{transform:scale(.96);transition-duration:.08s}
    .btn-primary{background:#1a1a1a;color:#fff}
    .btn-primary:disabled{opacity:.3;cursor:not-allowed;transform:none}
    .btn-outline{background:var(--card);color:var(--text);border:1px solid rgba(0,0,0,.06)}

    .calc-overlay{position:absolute;inset:0;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;transition:opacity .35s ease}
    .calc-overlay.hidden{opacity:0;pointer-events:none}
    .calc-spinner{width:32px;height:32px;border:3px solid #e5e5ea;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .calc-text{margin-top:14px;font-size:15px;color:var(--text2);text-align:center}

    #result{background:var(--bg);padding:16px;min-height:100vh}
    .rc{background:var(--card);padding:24px 18px 20px;text-align:left;border:1px solid rgba(0,0,0,.04);margin-bottom:14px}
    .rc-badge{font-size:10px;color:var(--text3);border:1px solid rgba(0,0,0,.06);display:inline-block;padding:3px 9px;margin-bottom:16px;letter-spacing:1px}
    .rc-icon-wrap{display:flex;justify-content:center;margin-bottom:12px}
    .rc-icon-badge{width:140px;height:140px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
    .rc-icon-badge img{width:100%;height:100%;object-fit:contain;display:block}

    /* === Hero Reveal === */
    .hero-overlay{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.85);pointer-events:none;opacity:0;transition:opacity .5s ease}
    .hero-overlay.active{opacity:1;pointer-events:auto}
    .hero-overlay .hero-card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 36px;background:linear-gradient(160deg,#1a1a1a,#2d2d2d);border:1px solid rgba(255,215,0,.2);width:92%;max-width:440px;position:relative}
    .hero-overlay .hero-card::before{content:'';position:absolute;inset:-3px;background:linear-gradient(135deg,rgba(255,215,0,.5),rgba(255,215,0,.1),rgba(255,215,0,.5),rgba(255,215,0,.05));z-index:-1;filter:blur(10px);animation:heroGlow 2.5s ease-in-out infinite alternate}
    @keyframes heroGlow{0%{opacity:.6;filter:blur(8px)}100%{opacity:1;filter:blur(16px)}}
    .hero-overlay .hero-img{width:240px;height:240px;margin-bottom:20px;opacity:0;transform:scale(.3) rotateY(90deg);position:relative}
    .hero-overlay .hero-img img{width:100%;height:100%;object-fit:contain;display:block}
    .hero-overlay .hero-img.active{animation:heroFlipIn 1.8s cubic-bezier(.34,1.56,.64,1) forwards}
    @keyframes heroFlipIn{
      0%{opacity:0;transform:scale(.3) rotateY(90deg)}
      40%{opacity:1;transform:scale(1.15) rotateY(-15deg)}
      60%{transform:scale(.95) rotateY(5deg)}
      80%{transform:scale(1.02) rotateY(-2deg)}
      100%{opacity:1;transform:scale(1) rotateY(0deg)}
    }
    .hero-overlay .hero-name{font-size:38px;font-weight:900;color:#fff;margin-bottom:6px;opacity:0;transform:translateY(20px);letter-spacing:-1px}
    .hero-overlay .hero-name.active{animation:fadeUp .6s ease .9s forwards}
    .hero-overlay .hero-tagline{font-size:17px;color:rgba(255,215,0,.7);margin-bottom:24px;opacity:0;transform:translateY(20px)}
    .hero-overlay .hero-tagline.active{animation:fadeUp .6s ease 1.1s forwards}
    .hero-overlay .hero-desc{padding:12px 16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);font-size:13px;color:rgba(255,255,255,.55);line-height:1.6;opacity:0;transform:translateY(20px);width:100%}
    .hero-overlay .hero-desc.active{animation:fadeUp .6s ease 1.3s forwards}
    @keyframes fadeUp{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:translateY(0)}}
    .hero-overlay .hero-shrink{position:absolute;bottom:40px;font-size:12px;color:rgba(255,255,255,.2);opacity:0;animation:fadeIn 1s ease 2.5s forwards}@keyframes fadeIn{to{opacity:1}}
    .rc-name{font-size:26px;font-weight:900;letter-spacing:-.5px;margin-bottom:3px;color:var(--text);text-align:center}
    .rc-tagline{font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:18px;padding:0 8px}
    .rc-divider{height:1px;background:rgba(0,0,0,.06);margin:0 16px 14px}
    .rc-bars{margin-top:14px;display:flex;flex-direction:column;gap:4px}
    .rc-item{padding:6px 0;border-bottom:1px solid rgba(0,0,0,.04)}
    .rc-item:last-child{border-bottom:none}
    .rc-item-row{display:flex;justify-content:space-between;align-items:center}
    .rc-item-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px}
    .rc-item-name .e{font-size:14px}
    .rc-item-score{font-size:12px;font-weight:600}
    .rc-item-desc{font-size:11px;color:var(--text3);margin-top:2px;line-height:1.4;padding-left:18px}
    .rc-item-track{height:6px;background:rgba(0,0,0,.04);margin-top:6px;overflow:hidden;border-radius:3px}
    .rc-item-fill{height:100%;transition:width .8s ease;border-radius:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}

    .pw{background:var(--card);padding:22px 20px;text-align:center;border:1px solid rgba(0,0,0,.04);margin-bottom:14px}
    .pw-title{font-size:17px;font-weight:700;margin-bottom:5px}
    .pw-desc{font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:14px}
    .pw-price{display:flex;align-items:baseline;justify-content:center;gap:2px;margin-bottom:14px}
    .pw-price .sym{font-size:16px;color:var(--text2)}
    .pw-price .amt{font-size:40px;font-weight:800;color:var(--text)}
    .pw-price .orig{font-size:14px;color:var(--text3);text-decoration:line-through;margin-left:6px}
    .pw-perks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:14px}
    .pw-perk{background:rgba(0,0,0,.03);padding:8px 6px;font-size:12px;color:var(--text2);border:1px solid rgba(0,0,0,.04)}
    .pw-note{font-size:11px;color:var(--text3);margin-top:8px}

    .rs{background:var(--card);padding:18px;margin-bottom:12px;border:1px solid rgba(0,0,0,.04)}
    .rs h3{font-size:15px;font-weight:700;margin-bottom:8px}
    .rs p{font-size:13px;line-height:1.7;color:var(--text2)}

    .sr{display:flex;gap:8px;margin-bottom:16px}
    .sr .btn{flex:1}
    .btn-share{background:var(--card);color:var(--text);border:1px solid rgba(0,0,0,.06)}
    .btn-restart{background:transparent;color:var(--text2);border:1px solid rgba(0,0,0,.06)}

    .toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:11px 18px;font-size:13px;font-weight:500;transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:100;white-space:nowrap;max-width:90vw}
    .toast.show{transform:translateX(-50%) translateY(0)}

    @media(max-width:374px){#cover h1{font-size:25px}.qt{font-size:16px}.qopt{padding:12px 13px;font-size:13px}}
    @media(min-width:500px){.app{border-left:1px solid rgba(0,0,0,.04);border-right:1px solid rgba(0,0,0,.04)}}
  </style>
</head>

const LB = ['A','B','C','D'];

let curQ=0, sel=[], sc={}, res={p:null,h:null}, unl=false;

const $=id=>document.getElementById(id);

function start(){
  curQ=0;sel=[];sc={};Object.keys(P).forEach(k=>sc[k]=0);res={p:null,h:null};unl=false;
  if(window._calcInterval)clearInterval(window._calcInterval);
  // Reset hero overlay
  const ov=$('heroOverlay');ov.classList.remove('active');
  ov.style.transform='';ov.style.opacity='';ov.style.transition='';
  ['heroImg','heroName','heroTagline','heroDesc'].forEach(id=>$(id).classList.remove('active'));
  show('qPage');render();
}

function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('hidden',p.id!==id));}

function render(){
  const q=Q[curQ];
  $('qCount').textContent=`${curQ+1}/${Q.length}`;
  $('qBar').style.width=`${((curQ+1)/Q.length)*100}%`;
  $('qText').textContent=q.t;
  const c=$('qOpts');c.innerHTML='';
  q.o.forEach((o,i)=>{
    const d=document.createElement('div');
    d.className='qopt'+(sel[curQ]===i?' selected':'');
    d.innerHTML=`<div class="qopt-inner"><span class="ql">${LB[i]}</span>${o.t}</div>`;
    d.addEventListener('click',()=>pick(i));
    c.appendChild(d);
  });
  $('qNext').disabled=sel[curQ]===undefined;
  $('qNext').textContent=curQ===Q.length-1?'🔮 看看我是什么物种':'下一步 →';
}

function pick(i){
  sel[curQ]=i;
  document.querySelectorAll('.qopt').forEach((c,j)=>c.classList.toggle('selected',j===i));
  $('qNext').disabled=false;
  setTimeout(()=>nextQ(),200);
}

function nextQ(){
  if(sel[curQ]===undefined)return;
  const q=Q[curQ];const c=q.o[sel[curQ]];
  Object.keys(c.s).forEach(k=>sc[k]+=c.s[k]);
  if(curQ<Q.length-1){curQ++;render();}
  else{show('result');$('calc').classList.remove('hidden');calcAnim();setTimeout(()=>{calcRes();renderR();$('calc').classList.add('hidden');if(window._calcInterval)clearInterval(window._calcInterval);},2000);}
}

function calcAnim(){
  const msgs=['🔮 分析你的投资基因…','📊 计算你的亏钱姿势…','🔄 回测你的交易行为…','🧬 生成人设画像…'];
  let i=0;const t=$('calcText');
  if(window._calcInterval)clearInterval(window._calcInterval);
  window._calcInterval=setInterval(()=>{i=(i+1)%msgs.length;t.textContent=msgs[i];},500);
}

function calcRes(){
  const s=Object.entries(sc).sort((a,b)=>b[1]-a[1]);
  res.p=s[0][0];res.h=s[1][0];
  if(s[0][1]===s[1][1]&&s[2])res.h=s[2][0];
}

function renderR(){
  const p=P[res.p],h=P[res.h];
  if(!p||!h)return;
  const s=Object.entries(sc).sort((a,b)=>b[1]-a[1]);
  const mx=Math.max(...s.map(x=>x[1]),1);
  let bars='';
  s.forEach(([n,sc2])=>{
    const info=P[n];const pct=Math.round((sc2/mx)*100);
    const c=info?.c||'#5e5ce6';
    bars+=`<div class="rc-item">
      <div class="rc-item-row">
        <div class="rc-item-name"><span class="e">${info?.e||''}</span>${n}</div>
        <span class="rc-item-score" style="color:${c}">${sc2}分</span>
      </div>
      <div class="rc-item-desc">${info?.d||''}</div>
      <div class="rc-item-track"><div class="rc-item-fill" style="width:${pct}%;background:${c}"></div></div>
    </div>`;
  });
  // Build normal result card (hidden initially)
  $('rc').innerHTML=`
    <div class="rc-badge">📊 你的A股物种</div>
    <div class="rc-icon-wrap"><div class="rc-icon-badge" style="background:${p.c}22">${p.img?`<img src="${p.img}" alt="${res.p}">`:p.e}</div></div>
    <div class="rc-name">${res.p}</div>
    <div class="rc-tagline">"${p.t}"</div>
    <div style="margin:0 4px 16px;padding:8px 10px;background:rgba(0,0,0,.03);font-size:12px;color:var(--text2);line-height:1.5">${p.d||''}</div>
    <div class="rc-divider"></div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
      <span style="font-size:12px;font-weight:600;color:var(--text)">🧬 你的成分分析</span>
      <span style="font-size:10px;color:var(--text3)">得分越高说明你越接近这个物种</span>
    </div>
    <div class="rc-bars">${bars}</div>`;
  // Show hero reveal first
  showHero(p);
  // Auto show full report after hero dismiss
  setTimeout(()=>{showFull();},5600);
  // Also allow click to show it sooner
  const checkFull=setInterval(()=>{
    if(!document.querySelector('.hero-overlay.active')){
      try{showFull();}catch(e){}
      clearInterval(checkFull);
    }
  },100);

function showHero(p){
  const overlay=$('heroOverlay');
  const img=$('heroImg');
  const name=$('heroName');
  const tagline=$('heroTagline');
  const desc=$('heroDesc');
  // Set content
  img.innerHTML=p.img?`<img src="${p.img}" alt="${res.p}">`:p.e;
  name.textContent=res.p;
  tagline.textContent=`"${p.t}"`;
  desc.textContent=p.d||'';
  overlay.classList.add('active');
  // Sequence animations
  setTimeout(()=>img.classList.add('active'),100);
  setTimeout(()=>name.classList.add('active'),900);
  setTimeout(()=>tagline.classList.add('active'),1100);
  setTimeout(()=>desc.classList.add('active'),1300);
  // Auto dismiss after 5s with shrink animation
  let heroTimer=setTimeout(()=>{
    dismissHero();
  },5000);
  function dismissHero(){
    overlay.style.transition='opacity .6s ease,transform .6s ease';
    overlay.style.transform='scale(.8)';
    overlay.style.opacity='0';
    setTimeout(()=>{
      overlay.classList.remove('active');
      overlay.style.transform='';
      overlay.style.opacity='';
      overlay.style.transition='';
      [img,name,tagline,desc].forEach(el=>el.classList.remove('active'));
    },600);
  }
  // Also allow click to dismiss early
  overlay.onclick=function(){
    clearTimeout(heroTimer);
    dismissHero();
  };
}
}

    '关灯吃面':'1. 关灯之前，先看一眼账户。不是让你折磨自己，是让你知道你的钱到底在经历什么。逃避解决不了问题，只会让你少吃几碗好面。\n2. 给自己的每一只持仓设一个止损线——15%就够了。到了就关灯吃面——但吃完之后要记得打开灯。\n3. 你最大的问题不是亏钱，是亏了钱之后什么都不做。亏损不可怕，可怕的是把"扛着"当成了策略。\n4. 下次吃面的时候问自己一个问题：如果这是我今天刚买的股票，我还愿意买吗？如果答案是"不"——那你就该卖了。\n5. 你不是没有赚钱的能力，你是没有"认错"的勇气。在这个市场上，认错不是丢人的事——吃冷面才是。',
    '抄底圣体':'1. 在抄底之前，先问自己一个问题：如果这只股票再跌20%，你还敢不敢加仓？如果敢——那你现在的位置可能真的接近底部了。如果不敢——那你现在抄的就不是底。\n2. 把你的抄底线从"跌了多少"改成"跌到了什么估值"。PE分位数比跌幅百分比更有参考价值。\n3. 每个月只允许自己抄底一次。你太容易兴奋了——冷却期对你来说是救命的东西。\n4. 每次抄底之后写一句话记录你当时的心理状态。一个月后回看——你会发现大部分时候你的"这次不一样"其实都一样。\n5. 你的乐观是超能力，但超能力需要方向。不是所有下跌都是机会——有些下跌是在告诉你"你错了"。学会区分这两者，你就能从抄底圣体升级为抄底真神。',
    '销户再销户':'1. 这次是真的。如果你已经销户超过三次——你不要再相信自己了。把你的账户密码给你最信任的人。不是让你把钱给别人管，是让你给自己增加一个操作的阻力。\n2. 把你删掉的交易软件下载回来——你今天晚上就想打开了对吧？这就对了。你需要的不是删软件，是需要明白你为什么会反复回来。\n3. 用一张纸写下你每次销户的原因和重新开户的原因。你会发现它们在重复。你第一次亏了钱销户，第二次亏了钱销户——但你重新开户的原因永远不是"我想明白了"，而是"我手痒了"。\n4. 你不是不适合炒股——你是太喜欢"开始"的感觉了。每一次重新开始都让你充满希望。但投资需要的不是"开始"的激情，是"坚持"的耐力。\n5. 把炒股省下来的时间去学一样新的东西。你会发现自己在这个市场里花了最多的时间、亏了最多的钱、得了最少的快乐。你的人生不应该只有A股。'
  };
  const qmap={

    '销户再销户':['"这次我真的不玩了"','"再给我一次机会"','"我不信A股永远不涨"','"我还就不信了这个邪"','"下次我一定管住手"']

    '定海神针':'回本帝','山顶冻人':'人形反指','Alpha猎手':'回本帝','回本帝':'定海神针','人形反指':'山顶冻人','关灯吃面':'Alpha猎手','抄底圣体':'回本帝','销户再销户':'定海神针'
  };
  const fmap={
    '定海神针':'定海神针在群里是那个"沉默的长者"。他不常发言，但每次发言都是一段59秒的语音。大盘暴跌的时候，他在群里说一句"不要慌"，所有人的焦虑真的缓解了30%。群里的人换了一茬又一茬，只有他的群名片从2017年到现在没变过。有时候你会嫌他啰嗦，但你也知道——如果哪天他不说话了，这个群就少了点什么。',
    '山顶冻人':'他是群里的"话事人"。每次发言都自带主角光环——"我觉得""我认为""我判断"。他发的每一句话后面都会跟一个句号，像是给一个论点画上了句号。他在群里和人争论的时候从不退让——不是因为他说得对，是因为他声音大。他推荐的票经常被群里的"人形反指"反向操作，但他至今没发现这个规律。',
    'Alpha猎手':'Alpha猎手是群里的"科学顾问"。每次发言大家都要查字典——"协整""GARCH""马尔可夫链"。他发一张回测曲线图，群里没人看得懂，但都会点赞。有一次他在群里讲风险平价策略，讲到第三句就没人理了。但他不在乎——他相信总有一天大家会明白他的厉害。大家确实相信他厉害——只是不敢跟他的模型下单。',
    '回本帝':'回本帝是群里的"励志担当"。他的持仓永远在"被套→快回本了→又跌了"之间反复横跳。每次他说"还差两个点就回本了"，大家就知道他至少还要再熬两个月。但他从来不放弃——这种精神在群里感染了所有人。有人问他"你图什么"，他想了想说："我就想看看回本是什么感觉。"大家都沉默了，因为每个人都在等那个感觉。',
    '人形反指':'他是群里的"红人"。每次他买入截图一发，群里就有人说"收到，马上做反方向"。他的操作记录被群友做成了一张Excel表——作为反向操作指南。他自己也知道这件事，但他很自豪，因为群里真的有人靠他赚了钱。他是全群唯一一个通过反向贡献实现社会价值的人。',
    '关灯吃面':'关灯吃面是群里的"淡定哥"。大盘跌了5%的时候大家在骂，他在发吃面的照片；大盘跌了10%的时候大家在哭，他在发第二碗面的照片。他不怎么说话，但他的朋友圈每天更新一碗面——面越来越素，从加蛋到不加蛋到只剩清汤挂面。群里有人问他"你怎么还在吃面"，他说"只有面不会背叛我"。大家都沉默了，因为大家都懂。',
    '抄底圣体':'抄底圣体是群里的"反向指标兼乐观源泉"。每次大盘跌了，别人在哀嚎，他在兴奋——"终于跌了！我等这个位置等了三个月！"他每次抄底都会截图发到群里，一个月后再看——大部分时候他截的是半山腰。但神奇的是，他从来不长记性。每次跌他都会重新燃起希望。群里的人从嘲笑他到羡慕他——不是羡慕他的收益，是羡慕他那种"永远相信明天会更好"的能力。在这个市场上，这种能力比赚钱更难能可贵。',
    '销户再销户':'他是群里的"编制内演员"。每过几个月，他固定上演一出"销户大戏"——截图、发誓、告别。第一次大家会挽留，第三次大家开始打赌他什么时候回来。群里的盘口是：他最多坚持两个月——赔率是1:1.5，买"一个月内回来"的人最多。他自己也下注了。他买的"两个月以上"——因为他是乐观主义者。'
  };
  const c=$('fullR');c.style.display='block';
  const best=bmap[res.p]||'定海神针';
  const quotes=qmap[res.p]||['"我不玩了"','"把钱还我"'];
  const friend=fmap[res.p]||'你们在一个群里，但很少聊天。';
  const s=Object.entries(sc).sort((a,b)=>b[1]-a[1]);
  const pScore=s.find(x=>x[0]===res.p);
  const totalQ=Q.length;
  const maxPossible=totalQ*2;
  const pct=Math.round(((pScore?pScore[1]:0)/maxPossible)*100);
  c.innerHTML=`
    <div class="rs"><h3>🧬 深度人设解盘 · ${res.p}</h3><p style="white-space:pre-line">${dmap[res.p]||''}</p></div>
    <div class="rs"><h3>⚡ 你的亏钱核心姿势</h3><p style="white-space:pre-line">${lmap[res.p]||''}</p></div>
    <div class="rs"><h3>📊 人设浓度分析</h3><p>你在这份鉴定中的「${res.p}」浓度为 <strong>${pct}%</strong>（满分100%）。其余较高维度：</p><div class="rc-bars" style="margin-top:8px">${s.slice(1,5).map(([n,v])=>{
      const info=P[n]||{};const pct2=Math.round((v/maxPossible)*100);const c2=info.c||'#5e5ce6';
      return `<div class="rc-item">
        <div class="rc-item-row">
          <div class="rc-item-name"><span class="e">${info.e||''}</span>${n}</div>
          <span class="rc-item-score" style="color:${c2}">${pct2}%</span>
        </div>
        <div class="rc-item-desc">${info.d||''}</div>
        <div class="rc-item-track"><div class="rc-item-fill" style="width:${pct2}%;background:${c2}"></div></div>
      </div>`;
    }).join('')}</div></div>
    <div class="rs"><h3>🎙️ 你的经典语录</h3><p>${quotes.map((q,i)=>`「${q}」`).join('  ')}</p><p style="margin-top:6px;color:var(--text3);font-size:12px">——你每次说这些话的时候都很真诚，这就很可怕了。</p></div>
    <div class="rs"><h3>🩹 自救指南（认真版）</h3><p style="white-space:pre-line">${wmap[res.p]||''}</p></div>
    <div class="rs"><h3>🤝 与你相克的人设</h3><p>在这个市场里，你最看不上的是 <strong>${best}</strong>（${P[best]?.e||''}）。你觉得他们的操作方式就是在送钱。奇怪的是——他们也觉得你在送钱。</p></div>
    <div class="rs"><h3>👥 群友鉴</h3><p>${friend}</p></div>
    <div class="rs" style="text-align:center"><p style="color:var(--text3);font-size:12px">📊 本鉴定结果纯属娱乐 · 亏了别怪市场 · 要怪就怪这个测试</p></div>
  `;
}

function shareR(){
  const p=P[res.p],h=P[res.h];
  const t=`📊 我的A股人设鉴定结果\n\n我是【${res.p}】${p.e}\n"${p.t}"\n\n隐藏属性：${res.h} ${h.e}\n\n来测测你是什么物种 👉 [链接]`;
  if(typeof navigator.share==='function')navigator.share({title:'A股人设鉴定器',text:t}).catch(()=>{});
  else navigator.clipboard.writeText(t).then(()=>toast('📋 已复制，去发朋友圈鉴定一下你的朋友们吧！')).catch(()=>toast('截图发朋友圈吧 ✨'));
}

function restart(){
  // Reset hero overlay
  const ov=$('heroOverlay');ov.classList.remove('active');
  ['heroImg','heroName','heroTagline','heroDesc'].forEach(id=>$(id).classList.remove('active'));
  show('cover');
}

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
</script>
